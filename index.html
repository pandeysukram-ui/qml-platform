<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trade With Vibes — NEPSE Suite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#040B16;font-family:'Chakra Petch',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;gap:0;background:#080c12;border-bottom:1px solid #1a2535;padding:0 8px;flex-shrink:0;}
.brand{font-family:'Share Tech Mono',monospace;font-size:11px;color:#f5c518;letter-spacing:2px;padding:10px 14px 10px 4px;white-space:nowrap;}
.tab-btn{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;color:#6a8aaa;padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:#dce6f0;}
.tab-btn.on{color:#f5c518;border-bottom-color:#f5c518;}
.frames{flex:1;position:relative;overflow:hidden;}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#040B16;display:none;}
.frames iframe.on{display:block;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f1b2e;color:#f5c518;font-family:'Share Tech Mono',monospace;font-size:10px;padding:8px 14px;border-radius:6px;border:1px solid #f5c51844;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">&#9670; TRADE WITH VIBES</div>
    <div class="tab-btn on" data-tab="drilldown" onclick="goTab('drilldown')">&#9776; INDEX / SECTORS</div>
    <div class="tab-btn" data-tab="screener" onclick="goTab('screener')">&#128269; SCREENER</div>
    <div class="tab-btn" data-tab="qml" onclick="goTab('qml')">&#9889; QML SUITE</div>
    <div class="tab-btn" data-tab="gann" onclick="goTab('gann')">&#9721; GANN CALC</div>
  </div>
  <div class="frames">
    <iframe id="frame-drilldown" class="on" src="drilldown_page.html"></iframe>
    <iframe id="frame-screener" src="screener_page.html"></iframe>
    <iframe id="frame-qml" src="nepse_qml_v2.html"></iframe>
    <iframe id="frame-gann" src="gann_hexagon_complete_mhl.html"></iframe>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function goTab(name){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('on',b.dataset.tab===name);});
  document.querySelectorAll('.frames iframe').forEach(function(f){f.classList.toggle('on',f.id==='frame-'+name);});
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt=setTimeout(function(){t.classList.remove('show');},1600);
}
// Relay: any child frame (Screener / Drill-down) can ask to jump straight to a scrip in QML,
// or just ask to switch tabs. Single click/tap only — no double-click/double-tap anywhere.
window.addEventListener('message',function(e){
  if(!e.data)return;
  if(e.data.type==='gotoScrip'&&e.data.sym){
    goTab('qml');
    var qf=document.getElementById('frame-qml');
    function relay(){
      qf.contentWindow.postMessage({type:'gotoScrip',sym:e.data.sym},'*');
    }
    // if QML iframe already loaded, relay immediately; otherwise wait for load
    if(qf.dataset.loaded==='1')relay();
    else qf.addEventListener('load',function once(){qf.dataset.loaded='1';relay();qf.removeEventListener('load',once);});
    showToast('\u2192 '+e.data.sym+' opened in QML');
  }
  if(e.data.type==='gotoTab'&&e.data.tab){
    goTab(e.data.tab);
  }
});
document.getElementById('frame-qml').addEventListener('load',function(){this.dataset.loaded='1';});
</script>
</body>
</html>
